<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐴 اسب سیاه - دیباگ نهایی</title>
  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 20px;
      margin: 10px 0;
    }
    .log {
      padding: 8px;
      margin: 4px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      border-right: 3px solid transparent;
    }
    .log-info {
      border-color: #f0c040;
      color: #f0c040;
      background: #1a1a0a;
    }
    .log-success {
      border-color: #4caf50;
      color: #4caf50;
      background: #0a1a0a;
    }
    .log-error {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: #1a0a0a;
    }
    .log-warn {
      border-color: #ff9800;
      color: #ff9800;
      background: #1a140a;
    }
    .error-box {
      background: #2a0a0a;
      border: 2px solid #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      color: #ff6b6b;
    }
    .success-box {
      background: #0a2a0a;
      border: 2px solid #4caf50;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      color: #4caf50;
    }
    .btn {
      background: #f0c040;
      color: #0a0a0f;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .stack-trace {
      background: #1a0a0a;
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
      padding: 10px;
      border-radius: 5px;
      font-size: 11px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }
    .code-block {
      background: #0a0a0f;
      color: #f0c040;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="card">
      <h1>🐴 اسب سیاه</h1>
      <p style="color:#b0a080;margin:10px 0;">
        صفحه‌ی دیباگ نهایی - نمایش خطای دقیق app.js
      </p>
      <div id="logs"></div>
      <div id="result"></div>
    </div>
  </div>

  <script>
    // =======================================================
    // ۱. بارگذاری data.js (به روش معمولی)
    // =======================================================
    (function loadDataJS() {
      try {
        const script = document.createElement('script');
        script.src = 'data.js';
        script.onload = function () {
          addLog('✅ data.js بارگذاری شد.', 'success');
          // بعد از بارگذاری data.js، app.js را بارگذاری می‌کنیم
          loadAppJS();
        };
        script.onerror = function () {
          addLog('❌ خطا در بارگذاری data.js (فایل پیدا نشد)', 'error');
          showError('فایل data.js پیدا نشد یا قابل بارگذاری نیست.');
        };
        document.head.appendChild(script);
      } catch (e) {
        addLog('❌ خطا در بارگذاری data.js: ' + e.message, 'error');
        showError(e.message);
      }
    })();

    // =======================================================
    // ۲. بارگذاری app.js با fetch و eval (برای گرفتن خطاها)
    // =======================================================
    function loadAppJS() {
      addLog('📥 بارگذاری app.js با fetch...', 'info');
      fetch('app.js')
        .then(function (res) {
          if (!res.ok) {
            throw new Error('HTTP ' + res.status + ' - فایل app.js پیدا نشد');
          }
          return res.text();
        })
        .then(function (code) {
          addLog('✅ app.js دریافت شد (' + code.length + ' کاراکتر)', 'success');
          // بررسی سریع برای خطاهای نحوی با new Function
          try {
            // اجرا با eval در یک try/catch
            eval(code);
            addLog('✅ app.js با موفقیت اجرا شد (بدون خطای نحوی)', 'success');
            // بعد از اجرا، وضعیت را بررسی می‌کنیم
            setTimeout(checkStatus, 300);
          } catch (e) {
            addLog('❌ خطای نحوی در app.js: ' + e.message, 'error');
            showError(
              '❌ خطای نحوی (SyntaxError) در app.js:\n' +
              e.message +
              '\n\n' +
              '📍 محل خطا: ' +
              (e.lineNumber ? 'خط ' + e.lineNumber : 'نامشخص') +
              (e.columnNumber ? ' - ستون ' + e.columnNumber : '') +
              '\n\n' +
              '📄 قطعه کد:\n' +
              getCodeSnippet(code, e.lineNumber)
            );
          }
        })
        .catch(function (err) {
          addLog('❌ خطا در دریافت app.js: ' + err.message, 'error');
          showError('خطا در دریافت app.js: ' + err.message);
        });
    }

    // =======================================================
    // ۳. ابزارها
    // =======================================================
    function addLog(msg, type) {
      type = type || 'info';
      const logs = document.getElementById('logs');
      const div = document.createElement('div');
      div.className = 'log log-' + type;
      div.textContent = msg;
      logs.appendChild(div);
      console.log(msg);
    }

    function showError(msg) {
      const result = document.getElementById('result');
      result.innerHTML =
        '<div class="error-box">' +
        msg.replace(/\n/g, '<br>') +
        '<br><br><button class="btn" onclick="location.reload()">🔄 بارگذاری مجدد</button>' +
        '</div>';
    }

    function getCodeSnippet(code, lineNumber) {
      if (!lineNumber) return '(محل خطا مشخص نیست)';
      const lines = code.split('\n');
      const start = Math.max(0, lineNumber - 3);
      const end = Math.min(lines.length, lineNumber + 2);
      let snippet = '';
      for (let i = start; i < end; i++) {
        const prefix = (i + 1) === lineNumber ? '👉 ' : '   ';
        snippet += prefix + (i + 1) + ': ' + lines[i] + '\n';
      }
      return snippet;
    }

    // =======================================================
    // ۴. بررسی وضعیت بعد از اجرای app.js
    // =======================================================
    function checkStatus() {
      const logs = document.getElementById('logs');
      const result = document.getElementById('result');

      function log(msg, type) {
        const div = document.createElement('div');
        div.className = 'log log-' + (type || 'info');
        div.textContent = msg;
        logs.appendChild(div);
        console.log(msg);
      }

      log('📋 بررسی وضعیت متغیرها...', 'info');

      // بررسی data.js
      if (typeof REALMS !== 'undefined') {
        log('✅ REALMS: ' + REALMS.length + ' قلمرو', 'success');
      } else {
        log('❌ REALMS تعریف نشده است!', 'error');
      }

      if (typeof SUB_REALMS !== 'undefined') {
        log('✅ SUB_REALMS: ' + Object.keys(SUB_REALMS).length + ' زیرقلمرو', 'success');
      } else {
        log('❌ SUB_REALMS تعریف نشده است!', 'error');
      }

      if (typeof NARROW_PATHS !== 'undefined') {
        log('✅ NARROW_PATHS: ' + Object.keys(NARROW_PATHS).length + ' مسیر باریک', 'success');
      } else {
        log('❌ NARROW_PATHS تعریف نشده است!', 'error');
      }

      // بررسی app.js
      if (typeof state !== 'undefined') {
        log('✅ state (app.js) مقداردهی شده است', 'success');
        log('   stage: ' + state.stage, 'info');
        log('   sessionId: ' + (state.sessionId || '(ندارد)'), 'info');
      } else {
        log('❌ state (app.js) تعریف نشده است!', 'error');
      }

      if (typeof render !== 'undefined') {
        log('✅ تابع render (app.js) تعریف شده است', 'success');
      } else {
        log('❌ تابع render تعریف نشده است!', 'error');
      }

      if (typeof init !== 'undefined') {
        log('✅ تابع init (app.js) تعریف شده است', 'success');
      } else {
        log('❌ تابع init تعریف نشده است!', 'error');
      }

      // نتیجه‌گیری
      if (typeof state !== 'undefined' && typeof render !== 'undefined') {
        log('✅ همه متغیرهای اصلی app.js تعریف شده‌اند.', 'success');
        result.innerHTML =
          '<div class="success-box">✅ app.js با موفقیت اجرا شد و همه متغیرها تعریف شده‌اند.<br><button class="btn" onclick="location.reload()">🔄 بارگذاری مجدد</button></div>';

        // تلاش برای اجرای دستی render
        try {
          log('🔄 تلاش برای اجرای دستی render()...', 'info');
          render();
          log('✅ render() با موفقیت اجرا شد.', 'success');
        } catch (e) {
          log('❌ خطا در اجرای render(): ' + e.message, 'error');
          result.innerHTML =
            '<div class="error-box">❌ خطا در render(): ' + e.message +
            '<br><div class="stack-trace">' + e.stack + '</div></div>';
        }
      } else {
        log('❌ متغیرهای اصلی app.js تعریف نشده‌اند.', 'error');
        log('   این یعنی app.js با خطا مواجه شده و کامل اجرا نشده است.', 'error');

        // اگر state تعریف نشده ولی لاگ‌ها نشان می‌دهند که eval خطایی نداشته، احتمالاً خطا در داخل کد است
        // اما چون eval خطای نحوی نداد، احتمالاً خطا در زمان اجرا (runtime) رخ داده
        // مانند خطای "cannot read property of undefined" که در حین اجرای تابع init یا render رخ می‌دهد
        // ولی ما اینجا نمی‌توانیم آن را بگیریم چون eval خطا را نمی‌دهد
        // برای گرفتن این نوع خطاها، باید کد را با try/catch بپوشانیم
        // اما از آنجایی که app.js را با eval اجرا کردیم، خطاهای runtime را هم می‌گیریم
        // پس اگر اینجا هستیم یعنی خطای runtime رخ داده که eval آن را گرفته
        // ولی eval خطا را گرفت و ادامه نداد، پس state تعریف نشد

        // حالا باید بفهمیم خطای runtime دقیقاً چه بود
        // برای این کار، کد را با try/catch در eval اجرا می‌کنیم
        // اما قبلاً eval را اجرا کردیم و خطای runtime را نگرفتیم چون eval فقط خطاهای نحوی را می‌گیرد
        // برای گرفتن خطاهای runtime، باید eval را در try/catch قرار دهیم
        // که قبلاً این کار را کردیم. اگر خطایی رخ داده، در catch قرار می‌گیرد.
        // اما چون خطایی نگرفتیم، یعنی eval موفق بوده ولی متغیرها تعریف نشده‌اند.
        // یعنی app.js به دلیل خطای runtime کامل اجرا نشده است.
        // برای گرفتن این خطاها، باید از window.onerror استفاده کنیم.
      }
    }

    // =======================================================
    // ۵. گرفتن خطاهای کلی با window.onerror
    // =======================================================
    window.onerror = function (message, source, lineno, colno, error) {
      console.error('❌ خطای کلی:', message, source, lineno, colno);
      const result = document.getElementById('result');
      result.innerHTML =
        '<div class="error-box">❌ خطای کلی در صفحه:<br>' +
        '<pre style="font-size:14px;color:#ff6b6b;">' +
        message +
        '\n' +
        'فایل: ' + source +
        '\n' +
        'خط: ' + lineno +
        ' - ستون: ' + colno +
        (error && error.stack ? '\n\n' + error.stack : '') +
        '</pre><br><button class="btn" onclick="location.reload()">🔄 بارگذاری مجدد</button>' +
        '</div>';
      return true;
    };
  </script>
</body>
</html>
