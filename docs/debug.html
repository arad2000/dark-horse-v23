<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug</title></head>
<body>
<h1>Testing JSON files</h1>
<script>
  async function test() {
    try {
      const res1 = await fetch('./data/micro_motives.json');
      console.log('micro_motives.json:', res1.status, res1.ok);
      const res2 = await fetch('./data/questions_v2.json');
      console.log('questions_v2.json:', res2.status, res2.ok);
    } catch(e) {
      console.error('Error:', e);
    }
  }
  test();
</script>
</body>
</html>
